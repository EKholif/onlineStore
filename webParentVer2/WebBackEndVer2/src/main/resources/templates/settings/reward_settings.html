<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{support/fragments/standard/layout/header::content}"></head>
<body>
<div th:replace="~{support/fragments/navbar/navbar::content}"></div>

<div class="container-fluid">
    <div class="text-center mt-3">
        <h2>Customer Reward Settings</h2>
    </div>

    <div th:if="${message != null}" class="alert alert-success text-center">
        [[${message}]]
    </div>

    <form th:action="@{/settings/rewards/save}" method="post" th:object="${setting}" class="m-3 border p-3">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{tenantId}" />

        <div class="form-group row my-3">
            <label class="col-sm-4 col-form-label">Points Earning Rate (Points per Currency Unit):</label>
            <div class="col-sm-8">
                <input type="number" step="0.01" class="form-control" th:field="*{earningRate}" required min="0" />
                <small class="text-muted">How many points a customer earns for each 1 unit of currency spent.</small>
            </div>
        </div>

        <div class="form-group row my-3">
            <label class="col-sm-4 col-form-label">Redemption Rate (Currency Value per Point):</label>
            <div class="col-sm-8">
                <input type="number" step="0.001" class="form-control" th:field="*{redeemRate}" required min="0" />
                <small class="text-muted">The monetary value of 1 point during checkout.</small>
            </div>
        </div>

        <div class="form-group row my-3">
            <label class="col-sm-4 col-form-label">Points for Product Review:</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" th:field="*{reviewPoints}" required min="0" />
            </div>
        </div>
        
        <div class="form-group row my-3">
            <label class="col-sm-4 col-form-label">Points for Registration (Signup Bonus):</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" th:field="*{registrationPoints}" required min="0" />
            </div>
        </div>

        <div class="form-group row my-3">
            <label class="col-sm-4 col-form-label">Minimum Points to Redeem:</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" th:field="*{minPointsToRedeem}" required min="0" />
            </div>
        </div>
        
        <div class="form-group row my-3">
             <label class="col-sm-4 col-form-label">Expire Period (Days):</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" th:field="*{pointExpiryDays}" required min="0" />
                <small class="text-muted">0 means points never expire.</small>
            </div>
        </div>

        <div class="text-center">
            <input type="submit" value="Save" class="btn btn-primary m-3" />
            <input type="button" value="Cancel" class="btn btn-secondary" id="buttonCancel" />
        </div>
    </form>
    
    <div th:replace="~{support/fragments/standard/layout_fragments :: footer}"></div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        $("#buttonCancel").on("click", function() {
            window.location = "[[@{/settings}]]";
        });
    });
</script>
</body>
</html>
