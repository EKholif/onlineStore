<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{support/fragments/standard/layout/header::content}"></head>

<body>

    <div th:replace="~{support/fragments/navbar/navbar::content}"></div>

    <div class="container-fluid px-4">
        <h2 class="text-center mt-3">[[${pageTitle}]]</h2>

        <form style="max-width: 700px; margin: 0 auto" th:action="@{/bookings/save}" th:object="${booking}"
            method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="border border-secondary rounded p-3">

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">Type:</label>
                    <div class="col-sm-8">
                        <select class="form-control" th:field="*{bookingType}" required>
                            <option value="DOCTOR">Doctor Appointment</option>
                            <option value="HOTEL">Hotel Booking</option>
                            <option value="LESSON">Lesson Booking</option>
                        </select>
                    </div>
                </div>

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">Resource Name:</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:field="*{name}" required minlength="2"
                            maxlength="150" placeholder="e.g. Dr. House, Room 101, Math Class" />
                    </div>
                </div>

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">Customer Name:</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:field="*{customerName}" required minlength="2"
                            maxlength="150" />
                    </div>
                </div>

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">Start Time:</label>
                    <div class="col-sm-8">
                        <input type="datetime-local" class="form-control" th:field="*{startTime}" />
                    </div>
                </div>

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">End Time:</label>
                    <div class="col-sm-8">
                        <input type="datetime-local" class="form-control" th:field="*{endTime}" />
                    </div>
                </div>

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">Status:</label>
                    <div class="col-sm-8">
                        <select class="form-control" th:field="*{status}">
                            <option value="PENDING">Pending</option>
                            <option value="CONFIRMED">Confirmed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="form-group row p-2">
                    <label class="col-sm-4 col-form-label">Details:</label>
                    <div class="col-sm-8">
                        <textarea class="form-control" th:field="*{details}" rows="3"></textarea>
                    </div>
                </div>

                <div class="text-center">
                    <input type="submit" value="Save" class="btn btn-primary m-3" />
                    <input type="button" value="Cancel" class="btn btn-secondary" id="buttonCancel" />
                </div>
            </div>
        </form>

        <div th:replace="~{support/fragments/standard/layout_fragments :: modal}"></div>
        <div th:replace="~{support/fragments/standard/layout_fragments :: footer}"></div>
    </div>

    <script th:src="@{/js/common.js}" type="text/javascript"></script>
    <script th:src="@{/js/common_form.js}" type="text/javascript"></script>
    <script>
        moduleURL = "[[@{/bookings}]]";
    </script>
</body>

</html>
