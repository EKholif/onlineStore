<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{support/fragments/standard/layout/header::content}"></head>
<body>
<div th:replace="~{support/fragments/navbar/navbar::content}"></div>
<div class="container-fluid px-4">
    <h2 class="text-center">[[${pageTitle}]]</h2>

    <!-- Platform Stats Cards -->
    <div class="row mt-4">
        <div class="col-xl-3 col-md-6">
            <div class="card bg-primary text-white mb-4">
                <div class="card-body">Platform Revenue</div>
                <div class="card-footer d-flex align-items-center justify-content-between">
                    <span class="h4" th:text="${#numbers.formatCurrency(platformRevenue)}">$0.00</span>
                    <div class="small text-white"><i class="fas fa-dollar-sign"></i></div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card bg-success text-white mb-4">
                <div class="card-body">Active Tenants</div>
                <div class="card-footer d-flex align-items-center justify-content-between">
                    <span class="h4" th:text="${activeTenants}">0</span>
                    <div class="small text-white"><i class="fas fa-store"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Top Viewed Products -->
    <div class="card mb-4">
        <div class="card-header">
            <i class="fas fa-table me-1"></i>
            Global Top Viewed Products
        </div>
        <div class="card-body">
            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Total Views</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${globalTopViewed}">
                    <td th:text="${item.name}">Product Name</td>
                    <td th:text="${item.value}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(globalTopViewed)}">
                    <td class="text-center" colspan="2">No data available</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{support/fragments/standard/layout_fragments :: footer}"></div>
</div>

<script th:src="@{/js/common.js}" type="text/javascript"></script>
</body>
</html>
