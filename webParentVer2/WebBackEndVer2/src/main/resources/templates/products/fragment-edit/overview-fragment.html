<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" th:remove="tag">

    <!-- Product Name -->
    <div class="form-group row p-3">
        <label class="col-sm-2 col-form-label">Name</label>
        <div class="col-sm-10">
            <input class="form-control" maxlength="256" minlength="2" placeholder="Please enter the product name" required th:field="*{name}"
                   type="text"/>
        </div>
    </div>

    <!-- Alias -->
    <div class="form-group row p-3">
        <label class="col-sm-2 col-form-label">Alias</label>
        <div class="col-sm-10">
            <input class="form-control" id="alias" maxlength="256" minlength="2" placeholder="Default is product name (spaces replaced by dashes)" required
                   th:field="*{alias}"
                   type="text"/>
        </div>
    </div>

    <!-- Brand -->
    <div class="form-group row p-3">
        <label class="col-sm-2 col-form-label">Brand</label>
        <div class="col-sm-10">
            <select class="form-control" id="brand" required th:field="*{brand}">
                <option value="">Select Brand</option>
                <option th:each="brand : ${listBrands}" th:text="${brand.name}" th:value="${brand.id}">
                </option>
            </select>
        </div>
    </div>

    <!-- Category -->
    <div class="form-group row p-3">
        <label class="col-sm-2 col-form-label">Category</label>
        <div class="col-sm-10">
            <select class="form-control" id="categories" required th:field="*{category}">
                <option th:each="cat : ${product.category != null ? product.brand.categories : listCategory}"
                        th:text="${cat.name}"
                        th:value="${cat.id}">
                </option>
            </select>
        </div>
    </div>

    <!-- Product Type -->
    <div class="form-group row p-3">
        <label class="col-sm-2 col-form-label">Product Type</label>
        <div class="col-sm-10">
            <select class="form-control" id="productType" th:field="*{productType}">
                <option value="PHYSICAL">Physical Product</option>
                <option value="DIGITAL">Digital / Download</option>
                <option value="SERVICE">Service</option>
                <option value="BOOKING">Booking / Appointment</option>
                <option value="SUBSCRIPTION">Subscription</option>
            </select>
        </div>
    </div>


    <!-- Enabled -->
    <div class="form-group row p-3">
        <label class="col-sm-2 col-form-label">Enabled</label>
        <div class="col-sm-10">
            <input th:field="*{enabled}" type="checkbox"/>
        </div>
    </div>


</div>

</body>
</html>
