<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div class="container p-3 mt-3">
        <div class="alert alert-info">
            <i class="fas fa-map-marker-alt me-2"></i>
            Specify the physical location or service area for this product/service.
        </div>

        <div class="form-group row mb-3">
            <label class="col-sm-2 col-form-label">Address:</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="e.g. 123 Main St, New York, NY" th:field="*{locationAddress}"
                       type="text">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label">Latitude:</label>
                    <div class="col-sm-8">
                        <input class="form-control" placeholder="0.000000" step="any" th:field="*{locationLatitude}"
                               type="number">
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label">Longitude:</label>
                    <div class="col-sm-8">
                        <input class="form-control" placeholder="0.000000" step="any" th:field="*{locationLongitude}"
                               type="number">
                    </div>
                </div>
            </div>
        </div>

        <!-- Placeholder for Map Integration (Google Maps / Leaflet) -->
        <div class="border rounded bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
            <span class="text-muted"><i class="fas fa-map me-2"></i>Map Preview Coming Soon</span>
        </div>
    </div>
</div>
</body>
</html>
