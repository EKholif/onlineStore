server.port=744
# AG-SPRING-CONFIG: Allow bean overriding for cases where multiple @EnableJpaRepositories scan same packages
spring.main.allow-bean-definition-overriding=true
logging.level.*=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/shop?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=0000
spring.mvc.pathmatch.matching-strategy=ant_path_matcher


## Multi-tenancy type
spring.jpa.properties.hibernate.multiTenancy=DISCRIMINATOR
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.onlineStore.admin.security.tenant.CurrentTenantIdentifierResolverImpl
app.storage.tenants-path=webParentVer2/WebBackEndVer2/tenants

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
#spring.resources.add-mappings=true
#spring.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
logging.file.name=onlineStore-BackEnd.log
logging.logback.rollingpolicy.file-name-pattern=onlineStore-BackEnd-%d{yyyy-MM-dd}.%i.log
#logging.logback.rollingpolicy.max-file-size=100KB
#logging.logback.rollingpolicy.total-file-size-cab=1MB
#logging.logback.rollingpolicy.max-history=14
#logging.logback.rollingpolicy.clean-history-on-start=true
spring.thymeleaf.cache=false
#logging.level.onlineStore=debug
#spring.mail.host=localhost
#spring.mail.port=143
# Hibernate show SQL for debugging
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Enable Hibernate filter support (optional, mostly Hibernate default)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true


# Enable statistics (useful لتتبع session / queries)
spring.jpa.properties.hibernate.generate_statistics=false

# Default schema / catalog (optional حسب DB setup)
# spring.jpa.properties.hibernate.default_schema=your_schema

# Tenant Debugging
logging.level.com.onlineStore.admin.security.tenant=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
# Distributed Tracing Configuration (AG-OBS-001)
# WHY: Enable distributed tracing to track requests across modules and correlate with tenant-id
management.tracing.sampling.probability=1.0
# Full sampling for dev/test, adjust to 0.1 (10%) in production
# Baggage Propagation - Tenant ID (AG-OBS-002)
# WHY: Ensure tenant-id travels with every trace span across service boundaries
management.tracing.baggage.remote-fields=tenant-id
management.tracing.baggage.correlation.fields=tenant-id
# This makes tenant-id available in MDC for logging correlation
# Disable Zipkin reporting for local development (prevents Connection refused errors)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.enabled=false
spring.zipkin.enabled=false
# Application name for trace identification
spring.application.name=WebBackEndVer2
spring.main.allow-bean-definition-overriding=true
