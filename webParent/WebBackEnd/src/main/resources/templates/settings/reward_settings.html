<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: page_head('Reward Settings', 'none')}" />

<body>
    <div class="container-fluid">
        <div th:replace="~{navigation :: menu}"></div>

        <div class="m-3">
            <h2>Reward Settings</h2>

            <div th:if="${message != null}" class="alert alert-success text-center">
                [[${message}]]
            </div>

            <form th:action="@{/settings/rewards/save}" method="post" th:object="${rewardSetting}"
                style="max-width: 700px; margin: 0 auto">
                <input type="hidden" th:field="*{id}" />
                <div class="border border-secondary rounded p-3">

                    <div class="form-group row m-2">
                        <label class="col-sm-4 col-form-label">Earning Rate (Points per $1):</label>
                        <div class="col-sm-8">
                            <input type="number" step="0.1" class="form-control" th:field="*{earningRate}" required
                                min="0" />
                            <small class="text-muted">How many points a customer earns for every currency unit
                                spent.</small>
                        </div>
                    </div>

                    <div class="form-group row m-2">
                        <label class="col-sm-4 col-form-label">Redemption Rate ($ per Point):</label>
                        <div class="col-sm-8">
                            <input type="number" step="0.001" class="form-control" th:field="*{redeemRate}" required
                                min="0" />
                            <small class="text-muted">The value of 1 point in currency (e.g., 0.01 means 100 points =
                                $1).</small>
                        </div>
                    </div>

                    <div class="form-group row m-2">
                        <label class="col-sm-4 col-form-label">Review Reward (Points):</label>
                        <div class="col-sm-8">
                            <input type="number" class="form-control" th:field="*{reviewPoints}" required min="0" />
                            <small class="text-muted">Points awarded for writing an approved review.</small>
                        </div>
                    </div>

                    <div class="form-group row m-2">
                        <label class="col-sm-4 col-form-label">Sign Up Bonus (Points):</label>
                        <div class="col-sm-8">
                            <input type="number" class="form-control" th:field="*{signUpPoints}" required min="0" />
                        </div>
                    </div>

                    <div class="form-group row m-2">
                        <label class="col-sm-4 col-form-label">Min Points to Redeem:</label>
                        <div class="col-sm-8">
                            <input type="number" class="form-control" th:field="*{minPointsToRedeem}" required
                                min="0" />
                        </div>
                    </div>

                    <div class="text-center m-3">
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                        <button type="button" class="btn btn-secondary" id="buttonCancel">Cancel</button>
                    </div>
                </div>
            </form>
        </div>

        <div th:replace="~{fragments :: footer}"></div>
    </div>
    <script type="text/javascript">
        $(document).ready(function () {
            $("#buttonCancel").on("click", function () {
                window.location = "[[@{/}]]";
            });
        });
    </script>
</body>

</html>
