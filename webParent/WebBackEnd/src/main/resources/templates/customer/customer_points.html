<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: page_head('Customer Points History', 'none')}"/>
<body>
<div class="container-fluid">
    <div th:replace="~{navigation :: menu}"></div>

    <div class="m-3">
        <h2>Points History: [[${customer.fullName}]]</h2>
        <div class="mb-3">
            <h4>Total Balance: <span class="badge badge-success">[[${customer.pointsBalance}]] Points</span></h4>
        </div>

        <div>
            <table class="table table-bordered table-striped table-hover table-responsive-xl">
                <thead class="thead-dark">
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Points</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="point : ${pointsHistory}">
                    <td th:text="${point.transactionDate}"></td>
                    <td th:text="${point.type}"></td>
                    <td>
                            <span th:if="${point.points > 0}" class="text-success fw-bold">
                                +[[${point.points}]]
                            </span>
                        <span th:if="${point.points < 0}" class="text-danger fw-bold">
                                [[${point.points}]]
                            </span>
                        <span th:if="${point.points == 0}" class="text-secondary fw-bold">
                                [[${point.points}]]
                            </span>
                    </td>
                    <td th:text="${point.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center m-1" th:if="${#lists.isEmpty(pointsHistory)}">
            <span>No points history found.</span>
        </div>

        <div class="text-center">
            <a th:href="@{/customer/customer}" class="btn btn-secondary">Back to Customers</a>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
