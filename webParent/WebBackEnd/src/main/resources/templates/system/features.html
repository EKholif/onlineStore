<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{support/fragments/standard/layout/header::content}"></head>

<body>

    <div th:replace="~{support/fragments/navbar/navbar::content}"></div>

    <div class="container-fluid px-4">
        <h2 class="text-center mt-3">Feature Management</h2>

        <div th:if="${message != null}" class="alert alert-success text-center">
            [[${message}]]
        </div>

        <!-- Add New Feature Form -->
        <div class="card shadow mb-4 mt-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Add/Edit Feature</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/system/features/save}" method="post" class="form-inline">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <input type="text" name="key" class="form-control"
                                placeholder="Feature Key (e.g., NEW_CHECKOUT)" required>
                        </div>
                        <div class="col-auto">
                            <input type="text" name="description" class="form-control" placeholder="Description">
                        </div>
                        <div class="col-auto">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="enabled" id="enabledCheck">
                                <label class="form-check-label" for="enabledCheck">
                                    Enabled
                                </label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Global Feature Flags</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped" width="100%" cellspacing="0">
                        <thead class="table-dark">
                            <tr>
                                <th>Key</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="feature : ${features}">
                                <td th:text="${feature.key}"></td>
                                <td th:text="${feature.description}"></td>
                                <td>
                                    <span th:if="${feature.enabled}" class="badge bg-success">Enabled</span>
                                    <span th:if="${!feature.enabled}" class="badge bg-secondary">Disabled</span>
                                </td>
                                <td>
                                    <a th:href="@{'/admin/system/features/toggle/' + ${feature.id}}" class="btn btn-sm"
                                        th:classappend="${feature.enabled ? 'btn-warning' : 'btn-success'}">
                                        <i th:class="${feature.enabled ? 'fas fa-toggle-off' : 'fas fa-toggle-on'}"></i>
                                        [[${feature.enabled ? 'Disable' : 'Enable'}]]
                                    </a>
                                    <a th:href="@{'/admin/system/features/delete/' + ${feature.id}}"
                                        class="btn btn-danger btn-sm" title="Delete"
                                        onclick="return confirm('Delete this feature flag?');">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(features)}">
                                <td colspan="4" class="text-center">No global flags defined</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="~{support/fragments/standard/layout_fragments :: footer}"></div>
    </div>

    <script th:src="@{/js/common.js}" type="text/javascript"></script>

</body>

</html>
