<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{supports/header/header::content}"></head>

<body>
    <div class="container-fluid">
        <div th:replace="~{supports/navbar/navbar::content}"></div>

        <div class="container">
            <div class="row align-items-center">
                <!-- Search fragment -->
                <div class="col-md-6">
                    <div th:replace="~{supports/fragment::search}"></div>
                </div>

                <!-- Page title -->
                <div class="col-md-6 text-end">
                    <h2 class="text-center ">[[${pageTitle}]]</h2>
                </div>
            </div>
        </div>


        <div class="container-fluid mt-3">
            <div class="row">
                <!-- Right column: Categories & Subcategories -->


                <div class="col-md-3 border-end">
                    <div th:replace="~{supports/breadcrumb :: content}"></div>
                    <h5 class="fw-bold bg-body-secondary mb-3 text-center"> 🛍️ Categories </h5>
                    <div class="list-group">
                        <div class="mb-2 p-2 rounded hover-bg-light" th:each="cat : ${listCategories}"
                            th:if="${cat.parent == null}">
                            <div class="d-flex align-items-center">
                                <img class="rounded-circle shadow-sm"
                                    style="width: 40px; height: 40px; object-fit: cover; margin-right: 12px;"
                                    th:src="@{${cat.getCatImagePath}}" />
                                <a class="text-dark text-decoration-none fw-bold fs-6 stretched-link"
                                    th:href="@{'/c/' + ${cat.alias}}">
                                    [[${cat.name}]]
                                </a>
                            </div>

                            <!-- Subcategories -->
                            <div class="ms-5 mt-2 border-start ps-3"
                                th:if="${cat.children != null && !cat.children.empty}">
                                <div class="d-flex align-items-center mb-2" th:each="sub : ${cat.children}">
                                    <img class="rounded-circle"
                                        style="width: 20px; height: 20px; object-fit: cover; margin-right: 8px; opacity: 0.8;"
                                        th:src="@{${sub.getCatImagePath}}" />
                                    <a class="small text-secondary text-decoration-none hover-text-primary"
                                        th:href="@{'/c/' + ${sub.alias}}">
                                        [[${sub.name}]]
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Left column:  Products -->
                <div class="col-md-9">
                    <h5 class="mb-3 text-center bg-primary-subtle">🛍️ Products</h5>


                    <div th:replace="~{supports/sortAndSearchDrop/sort_drop_menu :: sort_dropdown(
                ${modelUrl}, ${currentPage}, ${sortField}, ${sortDir}, ${keyWord})}">
                    </div>


                    <div class="row row-cols-2 row-cols-md-4 g-3">
                        <div class="col" th:each="product : ${products}">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="p-2 text-center">
                                    <img class="card-img-top" style="width: 100%; height: 120px; object-fit: contain;"
                                        th:src="@{${product.getImagePath}}" />
                                </div>
                                <div class="card-body text-center p-2">
                                    <a class="text-decoration-none small d-block" th:href="@{'/p/' + ${product.alias}}">
                                        [[${product.shortName}]]
                                    </a>
                                    <div class="row ml-1">
                                        <div class="col-xs">
                                            <input class="product-detail-rating-star" data-size="xs" dir="ltr"
                                                th:value="${product.averageRating}" type="text" />
                                        </div>
                                        <div class="col-xs ml-1 mt-3">
                                            <a th:href="@{ '#review'}">[[${product.reviewCount}]]
                                                rating(s)</a>
                                        </div>
                                    </div>
                                    <div th:replace="~{product/product_fragment :: product_price}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav th:replace="~{supports/paginate::content}"></nav>




        <div th:replace="~{supports/footer/footer_menu::content}"></div>

    </div>
    <script type="text/javascript">
        $(".product-detail-rating-star").rating({
            displayOnly: true,
            hoverOnClera: false,
            showCaption: false,
            theme: 'krajee-svg'
        });
    </script>
</body>

</html>
